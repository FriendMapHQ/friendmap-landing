<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Join on FriendMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <!--
    Where a FriendMap Pro venue's printed QR code leads: friendmap.app/v/?c=<community id>
    (made in the app, FriendMapMobile utils/venuePoster.js). Opens the app on
    the venue's popup on the map (friendmap://map?venue=<id>), or the store
    for someone who hasn't got it. Printed posters depend on this address, so
    keep it working.
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --yellow: #F7CD4A; --gold: #B8860B; --ink: #15161D; --ink-mid: #5A5C6E; --border: #ECECF1; }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink); background: #fff; line-height: 1.6;
      -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column;
    }
    .band { background: var(--yellow); padding: 22px 16px; text-align: center; }
    .band span { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 24px; color: #fff; }
    main { flex: 1; max-width: 440px; width: 100%; margin: 0 auto; padding: 40px 24px; text-align: center; }
    .logo { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; line-height: 1.25; margin-top: 22px; }
    p { color: var(--ink-mid); margin-top: 10px; }
    .button {
      display: block; margin-top: 28px; padding: 15px; border-radius: 30px; background: var(--yellow);
      color: #fff; font-weight: 700; font-size: 17px; text-decoration: none;
    }
    .divider { margin-top: 32px; color: var(--ink-mid); font-size: 14px; }
    .stores { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .store {
      display: block; padding: 13px; border-radius: 30px; border: 1.5px solid var(--yellow);
      color: var(--gold); font-weight: 700; text-decoration: none;
    }
    .store[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="band"><span>FriendMap</span></div>
  <main>
    <img class="logo" src="../FriendMapLogo.jpeg" alt="" />
    <h1>You&rsquo;re invited to join a community on FriendMap</h1>
    <p>Chat with the people who come here, and join their meetups.</p>

    <a class="button" id="open" href="friendmap://map">Open in FriendMap</a>

    <div class="divider">Don&rsquo;t have FriendMap yet?</div>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/id6762519026">Download on the App Store</a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.friendmaphq.friendmap">Get it on Google Play</a>
    </div>
  </main>

  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('c') || '';
      // Community ids are 24 hex characters; anything else just opens the map
      var venue = /^[a-f0-9]{24}$/i.test(id) ? id : '';
      var appLink = 'friendmap://map' + (venue ? '?venue=' + venue : '');
      var ua = navigator.userAgent;
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      var open = document.getElementById('open');
      if (isAndroid) {
        // Opens the app if it's installed, otherwise Google Play
        open.href = 'intent://map' + (venue ? '?venue=' + venue : '') +
          '#Intent;scheme=friendmap;package=com.friendmaphq.friendmap;end';
      } else {
        open.href = appLink;
      }

      // Only the store for this phone (both on a computer)
      if (isIOS) document.getElementById('android').hidden = true;
      if (isAndroid) document.getElementById('ios').hidden = true;
    })();
  </script>
</body>
</html>
